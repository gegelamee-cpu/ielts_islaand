<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{--card:#fff3d6;--ink:#3b2410;--wood:#8a5a2b;--acc:#f5a524;--ok:#2e9e4f;--bad:#d64545;--mut:#7a6650;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#2a1d12;--ink:#f6e8d0;--mut:#c2ad90;color-scheme:dark}}
:root[data-theme="dark"]{--card:#2a1d12;--ink:#f6e8d0;--mut:#c2ad90;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#0b5f87;font-family:Georgia,"Palatino Linotype",serif;color:var(--ink);overflow:hidden}
#wrap{position:fixed;inset:0;overflow:auto;display:flex;background:radial-gradient(#19a7d6,#0b5f87)}

#isl{width:100%;display:block;user-select:none;-webkit-user-drag:none}
.sign{position:absolute;transform:translate(-50%,0);background:linear-gradient(#c58a45,#8a5a2b);color:#fff3d6;border:2px solid #4a2d10;border-radius:6px;padding:2px 10px;font:700 clamp(12px,1.2vw,16px) Georgia,serif;cursor:pointer;box-shadow:0 2px 0 #3a210a;white-space:nowrap;z-index:4}
.sign:hover,.sign:focus-visible{filter:brightness(1.2);outline:2px solid #fff}
#hero{position:absolute;width:13%;transform:translate(-50%,-90%);pointer-events:none;z-index:5;left:50%;top:56%}
#hi{width:100%;display:block;transform-origin:50% 90%}
#hero.flip #hf{transform:scaleX(-1)}
@keyframes walk{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6%) rotate(2deg)}}
.walk #hi{animation:walk .35s infinite}
@keyframes chop{0%{transform:rotate(0)}40%{transform:rotate(-14deg) translateY(-3%)}70%{transform:rotate(12deg) translateX(4%) scale(1.04)}100%{transform:rotate(0)}}
#hi.chop{animation:chop .5s}
.p{position:absolute;width:7px;height:7px;background:#c58a45;border-radius:2px;z-index:6;animation:pf .6s ease-out forwards}

.side{position:fixed;left:0;z-index:20;background:linear-gradient(#c58a45,#8a5a2b);color:#fff3d6;border:2px solid #4a2d10;border-left:0;border-radius:0 14px 14px 0;padding:9px 11px;font:700 12px Georgia,serif;cursor:pointer;box-shadow:2px 3px 0 #3a210a;text-align:left;max-width:128px;line-height:1.2}

#hud{position:fixed;right:8px;top:calc(8px + env(safe-area-inset-top,0px));z-index:20;background:var(--card);color:var(--ink);border:3px solid #4a2d10;border-radius:12px;padding:6px 10px;font-weight:700;font-size:13px;min-width:165px}
#hud .bar{margin-top:3px;height:8px}
#banner{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:40;background:#ffd24a;color:#3b2410;border:3px solid #4a2d10;border-radius:12px;padding:8px 14px;font-weight:700;display:none;max-width:75vw;text-align:center;box-shadow:0 4px 12px #0006}
#toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 15px;border-radius:20px;z-index:60;display:none;font:14px system-ui}
#modal{position:fixed;inset:0;background:#0008;z-index:30;display:none;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#modal.on{display:flex}#modal.l{justify-content:flex-start}
.box{position:relative;background:var(--card);color:var(--ink);border:4px solid #4a2d10;border-radius:16px;width:min(95vw,680px);max-height:90dvh;overflow:auto;padding:14px 16px;font:15px/1.45 system-ui,sans-serif}
#modal.l .box{border-radius:0 16px 16px 0;width:min(95vw,450px);max-height:100%;height:100%}
.x{position:sticky;float:right;top:0;background:var(--bad);color:#fff;border:0;border-radius:8px;width:32px;height:32px;font-size:16px;cursor:pointer;z-index:5}
input,select,textarea{font:inherit;color:inherit;background:#7f7f7f20;border:1px solid var(--wood);border-radius:8px;padding:6px 8px;max-width:100%}
textarea{width:100%;min-height:145px}
.b{background:var(--acc);color:#2b1a05;border:0;border-radius:9px;padding:7px 12px;font:700 13px system-ui;cursor:pointer}.b.s{background:var(--wood);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.bar{height:12px;background:#7f7f7f40;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.card{background:#7f7f7f1a;border-radius:10px;padding:9px 11px;margin:8px 0}
h3{margin:.2em 0 .4em;font-family:Georgia,serif}.mut{color:var(--mut);font-size:13px}
iframe.docv{width:100%;height:62vh;border:2px solid var(--wood);border-radius:8px;background:#fff;margin-top:6px}
@media (prefers-reduced-motion:reduce){.walk #hi{animation:none}}
</style>

<div id="wrap"><div id="stage"><img id="isl" alt="Isometric island map" src="island.jpeg"><div id="hero"><div id="hf"><img id="hi" alt="Explorer hero" style="visibility:hidden"></div></div></div></div>
<div id="hud"></div>
<button class="side" id="bMat" style="top:24%"><span>📚</span>Course Materials</button>
<button class="side" id="bTodo" style="top:40%"><span>✅</span>Today’s To-Do<b id="badge"></b></button>

<script>
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const K='ielts_island_v4',today=()=>new Date().toISOString().slice(0,10),roundBand=x=>Math.round(x*2)/2;
let S={name:'George Samir Lamee',target:8,apiKey:'',xp:0,todo:[],mats:[],ytLinks:[],exams:[],vault:[],draft:'',wType:'t2_disc',done:{},chest:'',spk:[],trk:{Listening:0,Reading:0,Writing:0,Speaking:0}};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||localStorage.getItem('ielts_island_v3')||localStorage.getItem('ielts_island_v2')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Saved in app database')}};

/* ---- IndexedDB for offline Android PDF / Image / Doc viewing ---- */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('ielts_island_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function putFile(id,blob){try{const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(blob,String(id));tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){}}
async function getFile(id){try{const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('files','readonly');const rq=tx.objectStore('files').get(String(id));rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error)})}catch(e){return null}}
async function delFile(id){try{const db=await idb();const tx=db.transaction('files','readwrite');tx.objectStore('files').delete(String(id))}catch(e){}}
const toDataURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});

/* ---- Real Gemini Multimodal AI Evaluator (Free Tier) ---- */
async function askGemini(parts){
  const key=(S.apiKey||'').trim();
  if(!key)throw new Error('NO_KEY');
  const models=['gemini-3.8-flash','gemini-3.5-flash-lite'];
  let lastErr='';
  for(const m of models){
    const url=`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(key)}`;
    const res=await fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        contents:[{parts}],
        generationConfig:{temperature:0.2,responseMimeType:'application/json'}
      })
    });
    if(res.ok){
      const data=await res.json();
      const raw=data?.candidates?.[0]?.content?.parts?.[0]?.text||'{}';
      return JSON.parse(raw);
    }
    lastErr='API '+res.status+': '+(await res.text()).slice(0,140);
  }
  throw new Error(lastErr);
}

function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2400)}
function gain(xp,trk){S.xp+=xp;if(trk&&S.trk[trk]!=null)S.trk[trk]=Math.min(100,S.trk[trk]+10);save();hud();toast('+'+xp+' XP')}
function hud(){const l=Math.floor(S.xp/100)+1;$('#hud').innerHTML=`${E(S.name)} · Lv ${l} · ${S.xp} XP<div class=bar><i style="width:${S.xp%100}%"></i></div><div class=mut style="font-size:11px;margin-top:2px">Tutor: Dr. Mohamed Khalil</div>`;const p=pend().length;$('#badge').textContent=p;$('#badge').style.display=p?'block':'none'}
const pend=()=>S.todo.filter(t=>t.date===today()&&!t.done);

/* ---- audio ---- */
let AC;const ac=()=>(AC=AC||new(window.AudioContext||window.webkitAudioContext)());
function chop(){try{const c=ac(),t=c.currentTime,n=c.createBufferSource(),b=c.createBuffer(1,c.sampleRate*.15,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);n.buffer=b;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=1400;n.connect(f);f.connect(c.destination);n.start(t);const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(50,t+.12);g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.16)}catch(e){}}
function chime(){try{const c=ac();[660,880,1100].forEach((fr,i)=>{const t=c.currentTime+i*.18,o=c.createOscillator(),g=c.createGain();o.frequency.value=fr;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.4);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.45)})}catch(e){}}

/* ---- hero cut-out ---- */
function cutout(src){return new Promise(r=>{const im=new Image();im.onload=()=>{const w=im.width,h=im.height,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0);const d=x.getImageData(0,0,w,h),p=d.data,seen=new Uint8Array(w*h),st=[];
const push=(a,b)=>{if(a<0||b<0||a>=w||b>=h)return;const k=b*w+a,i=k*4;if(seen[k]||p[i]<236||p[i+1]<236||p[i+2]<236)return;seen[k]=1;st.push(k)};
for(let a=0;a<w;a++){push(a,0);push(a,h-1)}for(let b=0;b<h;b++){push(0,b);push(w-1,b)}
while(st.length){const k=st.pop(),a=k%w,b=(k-a)/w;p[k*4+3]=0;push(a+1,b);push(a-1,b);push(a,b+1);push(a,b-1)}
x.putImageData(d,0,0);r(c.toDataURL('image/png'))};im.onerror=()=>r(src);im.src=src})}

/* ---- island, signs, hero movement ---- */
const Z=[['Listening',27,39,33,44],['Reading',47,36,45,40],['Writing',68,34,64,38],['Speaking',50,41,50,56],['Exams',81,57,76,50],['AI Agent',70,82,63,72],['Idioms',50,85,50,68],['Profile',31,74,37,66]];
Z.forEach(z=>{const b=document.createElement('button');b.className='sign';b.textContent=z[0];b.style.left=z[1]+'%';b.style.top=z[2]+'%';b.onclick=()=>visit(z);$('#stage').appendChild(b)});
const hero=$('#hero');let hx=50,hy=56,busy=false;
function go(x,y){return new Promise(r=>{const ms=Math.max(250,Math.hypot((x-hx)*1.79,y-hy)*60);hero.classList.toggle('flip',x<hx);hero.style.transition=`left ${ms}ms linear,top ${ms}ms linear`;hero.classList.add('walk');hero.style.left=x+'%';hero.style.top=y+'%';hx=x;hy=y;setTimeout(()=>{hero.classList.remove('walk');r()},ms)})}
function burst(){for(let i=0;i<10;i++){const p=document.createElement('i');p.className='p';p.style.left=(hx+(hero.classList.contains('flip')?-4:4))+'%';p.style.top=(hy-4)+'%';p.style.setProperty('--dx',(Math.random()*70-35)+'px');p.style.setProperty('--dy',(Math.random()*-60-10)+'px');$('#stage').appendChild(p);setTimeout(()=>p.remove(),650)}}
async function visit(z){if(busy)return;busy=true;try{ac().resume()}catch(e){}
hero.classList.toggle('flip',z[1]<hx);await go(50,56);await go(z[3],z[4]);hero.classList.toggle('flip',z[1]<z[3]);const hi=$('#hi');
for(let i=0;i<2;i++){hi.classList.remove('chop');void hi.offsetWidth;hi.classList.add('chop');await sleep(250);chop();burst();await sleep(350)}
hi.classList.remove('chop');busy=false;openZone(z[0])}

/* ---- modal & category tabs ---- */
let cur=null,tab='study';
function open(fn,left){stopAll();cur=fn;$('#modal').classList.toggle('l',!!left);$('#modal').classList.add('on');fn()}
const refresh=()=>cur&&cur(),show=h=>$('#mb').innerHTML=h;
function stopAll(){try{speechSynthesis.cancel()}catch(e){}try{if(mr&&mr.state==='recording')stopRec()}catch(e){}}
const openZone=k=>{tab='study';open(R[k])};
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.closest('[data-close]')){stopAll();$('#modal').classList.remove('on');cur=null}});
$('#mb').addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&H[t.dataset.a])H[t.dataset.a](t)});
$('#mb').addEventListener('input',e=>{const i=e.target.id;if(i==='wt'){S.draft=e.target.value;save();wc()}if(i==='sq')lookup(e.target.value)});
$('#bMat').onclick=()=>open(R.Materials,1);$('#bTodo').onclick=()=>open(R.Todo,1);$('#bAbout').onclick=()=>open(R.About);
document.addEventListener('click',()=>{try{ac().resume()}catch(e){}},{once:true});
const H={},R={};
H.tab=t=>{tab=t.dataset.t;refresh()};
const tabs=(cat,pLabel='🎯 Practice & Evaluate')=>`<div class=mut style="margin-bottom:6px">👨‍🏫 Tutor: <b>Dr. Mohamed Khalil</b> · Target: Band <b>${S.target}</b></div>
<div class=row style="border-bottom:2px solid var(--wood);padding-bottom:8px">
<button class="b ${tab==='study'?'':'s'}" data-a=tab data-t=study>📚 Course Material & Videos</button>
<button class="b ${tab==='gram'?'':'s'}" data-a=tab data-t=gram>📖 Grammar Reference</button>
<button class="b ${tab==='prac'?'':'s'}" data-a=tab data-t=prac>${pLabel}</button>
</div>`;

/* ---- Universal In-App Document Viewer (Works offline inside Android WebView) ---- */
async function viewMaterial(id,targetEl){
  const m=S.mats.find(x=>String(x.id)===String(id));
  if(!m)return;
  const box=$(targetEl);
  if(!m.hasFile){
    box.innerHTML=`<div class=card style="border:2px solid var(--wood)"><b>${E(m.n)}</b><p>${E(m.nt||'')}</p><button class="b s" onclick="this.parentElement.remove()">Close Viewer</button></div>`;
    return;
  }
  box.innerHTML=`<div class=card>Loading <b>${E(m.n)}</b>…</div>`;
  const blob=await getFile(m.id);
  if(!blob){box.innerHTML='';return toast('File data not found in storage')}
  const lower=m.n.toLowerCase();
  const isPdf=(m.type==='application/pdf')||lower.endsWith('.pdf');
  const isImg=(m.type||'').startsWith('image/')||/\.(png|jpe?g|gif|webp)$/i.test(lower);
  const isTxt=(m.type||'').startsWith('text/')||/\.(txt|md|csv|json)$/i.test(lower);

  if(isPdf){
    const dataUrl=await toDataURL(blob);
    box.innerHTML=`<div class=card style="border:2px solid var(--wood)">
      <div class=row style="justify-content:space-between"><b>📄 ${E(m.n)}</b><button class="b s" onclick="this.closest('.card').remove()">✕ Close PDF</button></div>
      <iframe class="docv" src="${dataUrl}"></iframe>
    </div>`;
  }else if(isImg){
    const dataUrl=await toDataURL(blob);
    box.innerHTML=`<div class=card style="border:2px solid var(--wood)">
      <div class=row style="justify-content:space-between"><b>🖼️ ${E(m.n)}</b><button class="b s" onclick="this.closest('.card').remove()">✕ Close Image</button></div>
      <img src="${dataUrl}" style="max-width:100%;border-radius:8px;margin-top:6px">
    </div>`;
  }else if(isTxt){
    const txt=await blob.text();
    box.innerHTML=`<div class=card style="border:2px solid var(--wood)">
      <div class=row style="justify-content:space-between"><b>📝 ${E(m.n)}</b><button class="b s" onclick="this.closest('.card').remove()">✕ Close</button></div>
      <pre style="white-space:pre-wrap;font:13px system-ui;margin-top:6px">${E(txt)}</pre>
    </div>`;
  }else{
    box.innerHTML=`<div class=card style="border:2px solid var(--wood)">
      <b>📎 ${E(m.n)}</b><p class=mut>Note: ${E(m.nt||'No summary note')}</p>
      <p class=mut>Tip: Convert .docx files to PDF before uploading so they render directly inside the app screen on Android.</p>
      <button class="b s" onclick="this.closest('.card').remove()">Close</button>
    </div>`;
  }
}
H.openById=t=>viewMaterial(t.dataset.id,t.dataset.box||'#secView');

/* ---- Course-Only Materials + YouTube Course Videos Renderer per Category ---- */
H.addSecYT=t=>{
  const cat=t.dataset.cat;
  const title=($('#ytTitle_'+cat)?.value||'').trim();
  let url=($('#ytUrl_'+cat)?.value||'').trim();
  if(!url)return toast('Paste a YouTube link first');
  if(!/^https?:\/\//i.test(url))url='https://'+url;
  S.ytLinks.push({id:Date.now(),cat,t:title||url,u:url});
  save();toast('Course video added!');refresh();
};
H.delSecYT=t=>{
  S.ytLinks=S.ytLinks.filter(x=>String(x.id)!==String(t.dataset.id));
  save();refresh();
};

function renderCourseSection(cat){
  const list=S.mats.filter(m=>m.tr===cat);
  const vids=S.ytLinks.filter(v=>v.cat===cat);
  const matHtml=list.length
    ? list.map(m=>`<div class=card>
        <b>📄 ${E(m.n)}</b>
        ${m.nt?`<div class=mut style="margin-top:3px">${E(m.nt)}</div>`:''}
        <div class=row><button class=b data-a=openById data-id="${m.id}" data-box="#secView_${cat}">👁️ Open Material</button></div>
      </div>`).join('')
    : `<div class=card style="border:1px dashed var(--wood);text-align:center;padding:14px">
        <b>No material uploaded for ${cat} till now.</b>
        <div class=mut style="margin-top:4px">Open <b>📚 Course Materials</b> on the left sidebar and upload your ${cat} PDF, image, or notes to display them here.</div>
      </div>`;

  const vidHtml=vids.length
    ? vids.map(v=>`<div class=card style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <a href="${E(v.u)}" target="_blank" rel="noopener" style="font-weight:700;color:var(--ink)">▶ ${E(v.t)}</a>
        <button class="b s" data-a=delSecYT data-id="${v.id}">✕</button>
      </div>`).join('')
    : `<div class=mut>No YouTube course videos added for ${cat} yet.</div>`;

  return `<h4 style="margin:6px 0">📂 ${cat} Course Materials (Dr. Mohamed Khalil)</h4>
    ${matHtml}
    <div id="secView_${cat}"></div>
    <h4 style="margin:12px 0 6px">🎬 ${cat} Course Channel Videos</h4>
    <div class=card>
      <div class=row>
        <input id="ytTitle_${cat}" placeholder="Video title (e.g., Lesson 1)" style="flex:1;min-width:140px">
        <input id="ytUrl_${cat}" placeholder="https://youtube.com/..." style="flex:1;min-width:160px">
        <button class=b data-a=addSecYT data-cat="${cat}">+ Add Video</button>
      </div>
      ${vidHtml}
    </div>`;
}

/* ---- Grammar Reference per Category ---- */
const GRAM={
  Listening:`<div class=card><b>1. Passive Voice in Announcements & Lectures</b><br>Spoken prompts often use passives where questions use actives: <i>“Tickets <b>must be booked</b> in advance”</i> = <i>“You need to reserve tickets beforehand.”</i></div>
  <div class=card><b>2. Modal Verbs of Obligation & Permission</b><br>Listen carefully for <b>must / have to</b> (required), <b>needn't / don't have to</b> (optional), and <b>mustn't / prohibited</b> (not allowed).</div>
  <div class=card><b>3. Prepositions of Time & Place</b><br>Distinguish <i>at 10 p.m.</i> (exact time), <i>by Friday</i> (deadline), <i>for two weeks</i> (duration), and <i>on the second floor</i>.</div>`,
  Reading:`<div class=card><b>1. Qualifying Adverbs & Determiners (Crucial for T/F/NG)</b><br>Words like <i>all, every, solely, exclusively</i> vs. <i>some, many, slightly, primarily</i> often determine whether a statement is <b>False</b> or <b>True</b>.</div>
  <div class=card><b>2. Reduced Relative Clauses</b><br>Academic passages compress sentences: <i>“Policies <b>implemented in 2019</b> reduced waste”</i> = <i>“Policies which were implemented in 2019…”</i></div>
  <div class=card><b>3. Concessive Clauses (While / Whereas / Yet / Albeit)</b><br>The main claim usually sits in the <b>independent clause</b>, not the <i>Although/While</i> clause.</div>`,
  Writing:`<div class=card><b>1. Complex Sentences (Subordination)</b><br>Combine simple sentences using <i>although, whereas, provided that, thereby + -ing</i>: <i>“Remote work reduces commuting time, <b>thereby enhancing</b> employee productivity.”</i></div>
  <div class=card><b>2. Conditional Structures for Task 2</b><br>• <b>First Conditional (Real future):</b> <i>If governments invest in public transit, congestion will decline.</i><br>• <b>Second Conditional (Hypothetical):</b> <i>If cities banned private cars, air quality would improve dramatically.</i></div>
  <div class=card><b>3. Punctuation & Agreement</b><br>Always place a comma after introductory transitions (<i>However, / Consequently, / Furthermore,</i>) and check subject-verb agreement with uncountable nouns (<i>information, evidence, research</i> take singular verbs).</div>`,
  Speaking:`<div class=card><b>1. Narrative Tenses for Part 2 Stories</b><br>Blend <b>Past Simple</b> (main events), <b>Past Continuous</b> (background scene: <i>“The sun was setting when we arrived”</i>), and <b>Past Perfect</b> (earlier flashback: <i>“I had never seen anything like it”</i>).</div>
  <div class=card><b>2. Present Perfect for Experience & Change</b><br>Use <i>have/has + past participle</i> with <i>over the past few years, since, so far</i> when discussing trends or personal growth.</div>
  <div class=card><b>3. Speculating with Modals (Part 3)</b><br>Show grammatical range when predicting the future: <i>“It is highly likely that…”, “AI could potentially transform…”, “People might be inclined to…”</i></div>`,
  Idioms:`<div class=card><b>1. Fixed Prepositional Patterns</b><br>Idioms break if you change a single preposition or article: say <i>“<b>on</b> the same page”</i> (not <i>in</i>), <i>“<b>a</b> blessing in disguise”</i> (keep <i>a</i>), and <i>“once in <b>a</b> blue moon”</i>.</div>
  <div class=card><b>2. Verb Inflection Inside Idioms</b><br>Conjugate the verb naturally to fit your tense: <i>“She <b>bit</b> the bullet yesterday”</i> / <i>“I have been <b>burning</b> the midnight oil all week.”</i></div>`
};

const WT={
  t1_formal:{name:'Task 1 · Formal Letter (150+ w)',min:150,prompt:'You recently purchased a piece of electronic equipment online, and it arrived damaged. Write a letter to the customer service manager. In your letter: (1) describe what you bought and the problem, (2) explain how this has inconvenienced you, and (3) state what action you would like the company to take.',tpl:{Opening:'Dear Sir or Madam,\n\nI am writing to express my dissatisfaction regarding [item] (Order #[number]), which I purchased from your website on [date] and received in a damaged condition.',Details:'Upon opening the package, I discovered that [describe defect]. As I rely on this device for [work/study purpose], this issue has caused significant inconvenience.',Action:'Given that the item is under warranty, I would appreciate it if you could arrange a prompt replacement or issue a full refund within seven working days.',Closing:'I look forward to your prompt response.\n\nYours faithfully,\nGeorge Samir Lamee'}},
  t1_semi:{name:'Task 1 · Semi-Formal Letter (150+ w)',min:150,prompt:'You are attending a training course and need to take two days off next week for an urgent family matter. Write a letter to your course tutor, Dr. Mohamed Khalil. In your letter: (1) explain why you need to be absent, (2) say how you will catch up on missed work, and (3) ask for any recommended study materials.',tpl:{Opening:'Dear Dr. Khalil,\n\nI am writing to inform you that I will unfortunately need to miss our sessions on [dates] due to an urgent family commitment.',CatchUp:'To ensure I do not fall behind, I have already arranged to review the lecture notes with a classmate and complete all assigned exercises over the weekend.',Request:'Could you please let me know if there are any additional readings or practice tasks I should prioritize during my absence?',Closing:'Thank you very much for your understanding and support.\n\nYours sincerely,\nGeorge Samir Lamee'}},
  t1_informal:{name:'Task 1 · Informal Letter (150+ w)',min:150,prompt:'An English-speaking friend is planning to visit your city for the first time and has asked for advice on when to come and what to see. Write a letter to your friend.',tpl:{Opening:'Dear Alex,\n\nIt was wonderful to hear from you! I am thrilled that you are finally planning a trip to visit me.',Advice:'In my opinion, the best time to come is [season/month], as the weather is mild and ideal for sightseeing without heavy crowds.',Activities:'While you are here, we can explore [landmark], sample authentic local cuisine, and take a relaxing walk along the waterfront.',Closing:'Let me know your flight details as soon as you book them!\n\nWarm regards,\nGeorge'}},
  t2_disc:{name:'Task 2 · Discussion Essay (250+ w)',min:250,prompt:'Some people think technology makes life easier; others say it creates new problems. Discuss both views and give your opinion.',tpl:{Introduction:'It is often argued that [topic]. While some people believe [view A], I would contend that [your stance], for reasons outlined below.',Body:'To begin with, [main point]. This is largely because [reason]. For instance, [example], which demonstrates that [link to question]. Consequently, [result].',Counter:'On the other hand, critics maintain that [opposing view]. Although this carries some weight, it overlooks the fact that [rebuttal].',Conclusion:'In conclusion, although [concession], I firmly believe that [position], and [recommendation or prediction].'}},
  t2_opin:{name:'Task 2 · Opinion / Agree-Disagree (250+ w)',min:250,prompt:'Artificial intelligence will eventually replace most human teachers in schools and universities. To what extent do you agree or disagree?',tpl:{Introduction:'The rapid integration of artificial intelligence into education has sparked debate over whether machines could replace human educators. I strongly disagree with this view, as human mentorship remains irreplaceable.',Body:'First and foremost, effective teaching requires emotional intelligence and adaptability. For example, a skilled instructor can detect subtle signs of student anxiety and adjust their approach accordingly.',Body2:'Furthermore, educators serve as role models who foster critical thinking and ethical reasoning, qualities that automated algorithms cannot authentically replicate.',Conclusion:'In conclusion, while AI is a valuable supplementary tool, I am convinced that human teachers will remain at the core of education.'}},
  t2_prob:{name:'Task 2 · Problem & Solution (250+ w)',min:250,prompt:'In many major cities, traffic congestion is becoming increasingly severe. What are the main causes of this problem, and what measures can be taken to solve it?',tpl:{Introduction:'Traffic congestion has emerged as one of the most pressing challenges in modern urban centres. This essay will examine the primary causes of gridlock and propose viable solutions.',Causes:'The root cause of severe congestion is over-reliance on private vehicles combined with inadequate public transport infrastructure.',Solutions:'To mitigate this issue, municipal authorities should invest heavily in reliable metro networks and introduce congestion charges during peak hours.',Conclusion:'In summary, curbing urban traffic requires both expanding mass transit options and discouraging unnecessary car journeys.'}}
};

const SP=[
  'Describe a place you visited that left a strong impression on you. Say where it was, when you went, what you did, and why it was memorable.',
  'Describe a skill you would like to learn. Say what it is, why you want to learn it, and how you would go about it.',
  'Describe a person who has influenced you. Say who they are, how you know them, and what they taught you.'
];
let mr,chunks=[],lastBlob=null,t0,tint,strm,B={f:0,l:0,g:0,p:0},qi=0,lastDur=0;

H.nq=()=>{qi=(qi+1)%SP.length;$('#cue').textContent=SP[qi]};
H.saveS=()=>{
  const ov=roundBand((B.f+B.l+B.g+B.p)/4);
  if(ov<=0)return toast('Record and evaluate a real response first');
  S.spk.push({d:today(),b:ov});save();gain(25,'Speaking');
};

function stopRec(){
  clearInterval(tint);
  if(mr&&mr.state==='recording')mr.stop();
  const b=$('#rb');if(b)b.textContent='🎙 Start recording';
}

H.rec=async()=>{
  if(mr&&mr.state==='recording')return stopRec();
  try{strm=await navigator.mediaDevices.getUserMedia({audio:true})}
  catch(e){return toast('Microphone blocked – allow access and retry')}
  chunks=[];lastBlob=null;
  mr=new MediaRecorder(strm);
  mr.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data)};
  mr.onstop=()=>{
    lastDur=(Date.now()-t0)/1000;
    lastBlob=new Blob(chunks,{type:mr.mimeType||'audio/webm'});
    const a=$('#pl');
    if(a){a.src=URL.createObjectURL(lastBlob);a.hidden=false}
    strm.getTracks().forEach(t=>t.stop());
    toast('Audio captured ('+Math.round(lastDur)+'s). Tap Evaluate Speaking!');
  };
  t0=Date.now();mr.start();
  $('#rb').textContent='⏹ Stop recording';$('#pl').hidden=true;
  tint=setInterval(()=>{
    const s=Math.floor((Date.now()-t0)/1000);
    $('#tm').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  },250);
};

H.evalS=async()=>{
  if(!lastBlob||lastBlob.size<1500||lastDur<1.5){
    $('#ev').innerHTML=`<div class=card style="border:2px solid var(--bad)"><b>⚠️ No valid speech recorded</b><br>Your recording was too short or empty (${lastDur.toFixed(1)}s). Speak clearly for at least 15–60 seconds and try again.</div>`;
    return;
  }
  if(!(S.apiKey||'').trim()){
    $('#ev').innerHTML=`<div class=card style="border:2px solid var(--bad)"><b>🔑 Free Gemini API Key Needed</b><br>Open <b>Profile</b> on the island map and paste your free Google AI Studio key (<code>AIzaSy...</code>) so Dr. Mohamed Khalil’s AI can listen to your actual audio and score it accurately.</div>`;
    return;
  }
  $('#ev').innerHTML=`<div class=card>🎧 <b>Dr. Mohamed Khalil’s AI Examiner is listening to your recording…</b></div>`;
  try{
    const dataUrl=await toDataURL(lastBlob);
    const b64=dataUrl.split(',')[1];
    const mime=(lastBlob.type||'audio/webm').split(';')[0];
    const prompt=`You are Dr. Mohamed Khalil, a strict, certified IELTS Speaking Examiner. Listen carefully to the attached audio response to the IELTS cue card: "${SP[qi]}".
CRITICAL RULES:
- If the audio contains silence, breathing, background noise only, or fewer than 4 intelligible English words, set "speechDetected": false and all band scores to 0.
- Do NOT invent or assume words that were not spoken. Transcribe verbatim what you actually hear.
- Score strictly according to official IELTS Speaking Band Descriptors (0.0 to 9.0 in 0.5 increments).
Return ONLY valid JSON with this exact structure:
{
  "speechDetected": true,
  "transcript": "exact verbatim transcript of what the speaker said",
  "fluency": 6.5,
  "lexical": 6.5,
  "grammar": 6.5,
  "pronunciation": 6.5,
  "overall": 6.5,
  "strengths": ["specific strength observed in the audio"],
  "corrections": ["exact mistake heard -> natural Band 8 correction"],
  "band8Sample": "A natural Band 8.5 rewrite of the candidate's own ideas"
}`;
    const r=await askGemini([{text:prompt},{inlineData:{mimeType:mime,data:b64}}]);
    if(!r.speechDetected||!r.transcript||r.transcript.trim().split(/\s+/).length<4){
      B={f:0,l:0,g:0,p:0};
      $('#ev').innerHTML=`<div class=card style="border:2px solid var(--bad)"><b>🔇 Silence / Unclear Audio Detected (Band 0.0)</b><br>No clear English speech was heard in the recording. Check your mic and speak clearly into the device.</div>`;
      return;
    }
    $('#tr').textContent=r.transcript;
    B={f:+r.fluency||0,l:+r.lexical||0,g:+r.grammar||0,p:+r.pronunciation||0};
    const ov=roundBand(+r.overall||(B.f+B.l+B.g+B.p)/4);
    $('#ev').innerHTML=`<div class=card style="border:2px solid var(--ok)">
      <b>👨‍🏫 Dr. Mohamed Khalil’s Real Audio Evaluation · Overall Band: <span style="font-size:19px;color:var(--ok)">${ov.toFixed(1)}</span></b>
      <div class=row style="margin-top:6px">
        <span>Fluency: <b>${B.f.toFixed(1)}</b></span> ·
        <span>Lexical: <b>${B.l.toFixed(1)}</b></span> ·
        <span>Grammar: <b>${B.g.toFixed(1)}</b></span> ·
        <span>Pronunciation: <b>${B.p.toFixed(1)}</b></span>
      </div>
      <hr style="border:0;border-top:1px solid var(--wood);margin:8px 0">
      <b>✅ Strengths:</b><ul style="margin:4px 0 8px 18px;padding:0">${(r.strengths||[]).map(x=>`<li>${E(x)}</li>`).join('')}</ul>
      <b>✏️ Corrections & Upgrades:</b><ul style="margin:4px 0 8px 18px;padding:0">${(r.corrections||[]).map(x=>`<li>${E(x)}</li>`).join('')}</ul>
      <b>🌟 Band 8.5 Version of Your Answer:</b><div class=mut style="margin-top:4px;font-style:italic">“${E(r.band8Sample||'')}”</div>
      <div class=row style="margin-top:8px"><button class=b data-a=saveS>Save Verified Score (+25 XP)</button></div>
    </div>`;
    toast('Real IELTS evaluation complete!');
  }catch(err){
    $('#ev').innerHTML=`<div class=card style="border:2px solid var(--bad)"><b>⚠️ Evaluation Error:</b> ${E(err.message)}<br><span class=mut>Verify your internet connection and Gemini API key in Profile.</span></div>`;
  }
};

H.logE=()=>{const v=['eL','eR','eW','eS'].map(i=>+$('#'+i).value);if(v.some(x=>isNaN(x)||x<0||x>9))return toast('Enter bands 0–9');S.exams.push({d:$('#ed').value||today(),v,o:roundBand(v.reduce((a,b)=>a+b)/4)});save();gain(30);refresh()};
H.delE=t=>{S.exams.splice(t.dataset.i,1);save();refresh()};
R.Exams=()=>show(`<h3>🏟️ Mock Exam Arena</h3><div class=mut style="margin-bottom:6px">👨‍🏫 Supervised by <b>Dr. Mohamed Khalil</b> · Target: Band <b>${S.target}</b></div><div class=row>${['L','R','W','S'].map(k=>`<label>${k} <input id=e${k} type=number min=0 max=9 step=.5 style="width:64px"></label>`).join('')}<input id=ed type=date value="${today()}"><button class=b data-a=logE>Log test</button></div><p class=mut>Overall = average of four bands, rounded to the nearest half band (x.25 → x.5, x.75 → next whole).</p>`+S.exams.map((e,i)=>`<div class=card>${e.d} · L${e.v[0]} R${e.v[1]} W${e.v[2]} S${e.v[3]} → <b>Overall ${e.o.toFixed(1)}</b> <button class="b s" data-a=delE data-i=${i}>✕</button></div>`).reverse().join('')||'');

/* ---- Band 8 Vocabulary & Idioms Library with "When & How to Say It" ---- */
const D=[
  ['ubiquitous','w','Present or found everywhere at the same time.','Smartphones have become ubiquitous in modern workplaces.','Writing Task 2 & Speaking Part 3 when describing technology, social media, or global trends.','Pronounce: yoo-BIK-wi-tus. Say “X has become ubiquitous” rather than “X is everywhere.”'],
  ['mitigate','w','To make a problem, risk, or negative effect less severe.','Strict emission laws can mitigate the impact of urban pollution.','Writing Task 2 (Problem/Solution essays) and Speaking Part 3 policy discussions.','Pronounce: MIT-i-gayt. Always pair with a negative noun: “mitigate the risk / damage / impact.”'],
  ['exacerbate','w','To make an existing problem or bad situation even worse.','Traffic congestion is exacerbated by inadequate public transit.','Writing Task 2 & Speaking Part 3 when explaining causes of worsening issues.','Pronounce: ig-ZAS-er-bayt. Great upgrade for “make worse.”'],
  ['ameliorate','w','To improve a bad or unsatisfactory situation.','Targeted vocational training can ameliorate youth unemployment.','Formal Writing Task 2 essays proposing solutions.','Pronounce: uh-MEEL-yuh-rayt. Use in formal essays instead of “make better.”'],
  ['pragmatic','w','Dealing with problems sensibly and realistically rather than theoretically.','City planners need a pragmatic approach to housing shortages.','Speaking Part 3 & Writing Task 2 when evaluating solutions or leadership.','Pronounce: prag-MAT-ik. Say “take a pragmatic approach to…”'],
  ['meticulous','w','Showing great attention to detail; very careful and precise.','Our technical team keeps meticulous maintenance records.','Speaking Part 1/2 (describing work habits or a person) & Formal Letters.','Pronounce: muh-TIK-yoo-lus. Say “meticulous planning / attention to detail.”'],
  ['ephemeral','w','Lasting for a very short time.','Fame on social media platforms is often ephemeral.','Writing Task 2 & Speaking Part 3 when contrasting temporary trends with lasting value.','Pronounce: ih-FEM-er-ul. Use to describe trends, fame, or short-lived benefits.'],
  ['detrimental','w','Causing harm or damage.','Excessive screen time is detrimental to sleep quality.','Writing Task 2 & Speaking Part 3 when discussing negative consequences.','Pronounce: det-ri-MEN-tul. Always follow with “to”: “detrimental to health / productivity.”'],
  ['paramount','w','More important than anything else; supreme.','Passenger safety is of paramount importance in aviation.','Writing Task 2 & Formal Letters when emphasizing top priorities.','Pronounce: PAR-uh-mount. Say “is of paramount importance” or “is paramount.”'],
  ['resilient','w','Able to recover quickly from difficulties or adapt to change.','Resilient supply chains can withstand unexpected disruptions.','Speaking Part 2/3 (describing people, economies, or cities) & Writing Task 2.','Pronounce: ri-ZIL-yunt. Pair with people, communities, or economies.'],
  ['proliferate','w','To increase rapidly in number or spread quickly.','Online learning platforms have proliferated over the past five years.','Writing Task 2 & Speaking Part 3 when describing rapid growth.','Pronounce: pruh-LIF-uh-rayt. Intransitive verb: say “X has proliferated” (no object after it).'],
  ['curtail','w','To reduce, limit, or restrict something.','Governments must curtail single-use plastic production.','Writing Task 2 & Speaking Part 3 when recommending restrictions.','Pronounce: ker-TAYL. Strong formal replacement for “cut down on.”'],
  ['stringent','w','Very strict, precise, and strictly enforced.','The ministry introduced stringent quality standards for devices.','Writing Task 2 & Formal Letters regarding laws, rules, or safety checks.','Pronounce: STRIN-junt. Pair with “regulations / standards / criteria.”'],
  ['indispensable','w','Absolutely necessary; impossible to do without.','Digital literacy has become an indispensable skill in the modern economy.','Speaking Part 1/3 & Writing Task 2 when highlighting essential tools or skills.','Pronounce: in-di-SPEN-suh-bul. Say “an indispensable part of…”'],
  ['a double-edged sword','i','Something that brings both advantages and disadvantages.','Artificial intelligence is a double-edged sword: it boosts efficiency but risks job displacement.','Speaking Part 3 & Writing Task 2 Discussion essays when introducing balanced views.','Say naturally with a pause: “X is a double-edged sword; on one hand…, on the other…”'],
  ['the tip of the iceberg','i','A small visible part of a much larger hidden problem.','Reported data breaches are merely the tip of the iceberg.','Speaking Part 3 & Semi-Formal contexts when discussing deeper issues.','Say: “This issue is just the tip of the iceberg.”'],
  ['break the ice','i','To say or do something to relieve tension and start friendly conversation.','Our instructor told a light joke at the start of the workshop to break the ice.','Speaking Part 1/2 when describing social events, meetings, or first days.','Say: “To break the ice, we started with…”'],
  ['hit the nail on the head','i','To describe a situation or cause with 100% accuracy.','Dr. Khalil hit the nail on the head when he pointed out my pacing issue.','Speaking Part 1/2/3 when agreeing strongly with someone’s insight.','Use in Speaking (avoid in formal Writing Task 2): “You really hit the nail on the head.”'],
  ['on the same page','i','Thinking in the same way; in full agreement.','Before launching the project, we held a briefing to ensure everyone was on the same page.','Speaking Part 1/2 (work/teamwork topics) & Semi-Formal communication.','Say: “We are all on the same page regarding…”'],
  ['a blessing in disguise','i','An apparent misfortune that eventually leads to a good result.','Missing that flight turned out to be a blessing in disguise because I met a mentor at the lounge.','Speaking Part 2 stories about unexpected changes or setbacks.','Keep the article “a”: “It turned out to be a blessing in disguise.”'],
  ['burn the midnight oil','i','To study or work late into the night.','I have been burning the midnight oil to prepare for my December IELTS exam.','Speaking Part 1/2 when talking about exam preparation or tight deadlines.','Say: “I had to burn the midnight oil last week.”'],
  ['bite the bullet','i','To force yourself to do something difficult or unpleasant that you have been avoiding.','I finally decided to bite the bullet and book the computer-delivered IELTS test.','Speaking Part 2 when describing a tough decision or challenge.','Say: “I bit the bullet and…”'],
  ['once in a blue moon','i','Very rarely; almost never.','Because of my busy work schedule, I only eat at restaurants once in a blue moon.','Speaking Part 1 when asked “How often do you…?”','Place at the end of the sentence: “I go to the cinema once in a blue moon.”'],
  ['the elephant in the room','i','An obvious major problem that everyone avoids mentioning.','Budget constraints remained the elephant in the room throughout the meeting.','Speaking Part 3 when discussing ignored social or workplace problems.','Say: “Cost is really the elephant in the room here.”']
];

const card=d=>`<div class=card>
  <b>${E(d[0])}</b> <span class=mut>(${d[1]=='w'?'Academic Word':'Idiom'})</span>
  <div style="margin-top:4px"><b>Meaning:</b> ${E(d[2])}</div>
  <div><b>When to use:</b> ${E(d[4]||'Speaking & Writing')}</div>
  <div><b>How to say it:</b> ${E(d[5]||'Use naturally in context.')}</div>
  <div style="margin-top:4px"><i>Example: “${E(d[3])}”</i></div>
</div>`;

function lookup(q){q=q.toLowerCase().trim();const r=q?D.filter(d=>(d[0]+' '+d[2]+' '+(d[4]||'')+' '+(d[5]||'')).toLowerCase().includes(q)):D;$('#res').innerHTML=r.map(card).join('')||'<p class=mut>No entry yet. Try searching another keyword.</p>'}
R['AI Agent']=()=>{show(`<h3>🔮 Band 8 Vocabulary & Idioms Agent</h3><div class=mut style="margin-bottom:6px">Full Library with <b>When & How to Say It</b> · Curated with <b>Dr. Mohamed Khalil</b></div><input id=sq placeholder="Search any word, idiom, situation, or meaning…" style="width:100%"><div id=res></div>`);lookup('')};

/* ---- Idioms ---- */
const dn=Math.floor(Date.now()/864e5),dw=D.filter(x=>x[1]=='w'),di=D.filter(x=>x[1]=='i'),daily=()=>[dw[dn%dw.length],di[dn%di.length]];
H.chest=()=>{if(S.chest!==today()){S.chest=today();gain(10)}refresh()};
H.vs=t=>{const d=daily()[t.dataset.i];if(!S.vault.some(v=>v.w===d[0])){S.vault.push({w:d[0],m:d[2],wh:d[4],hw:d[5]});save();toast('Saved to vault')}refresh()};
H.va=()=>{const w=$('#vw').value.trim();if(w){S.vault.push({w,m:$('#vm').value.trim(),wh:$('#vwh').value.trim(),hw:$('#vhw').value.trim()});save();refresh()}};
H.vd=t=>{S.vault.splice(t.dataset.i,1);save();refresh()};
R.Idioms=()=>{const o=S.chest===today(),dd=daily();let body='';
  if(tab==='study')body=(o?dd.map((d,i)=>card(d)+`<button class="b s" data-a=vs data-i=${i}>Save to vault</button>`).join('')+'<p class=mut>Come back tomorrow for new treasure.</p>':`<div class=row><button class=b data-a=chest>🧰 Open today’s chest (+10 XP)</button></div>`)+`<h3>🗝️ Personal Word & Idiom Vault (When & How to Say)</h3><div class=card><div class=row><input id=vw placeholder="Word or idiom" style="flex:1"><input id=vm placeholder="Meaning" style="flex:1"></div><div class=row><input id=vwh placeholder="When to use (e.g., Speaking Part 2)" style="flex:1"><input id=vhw placeholder="How to say it / example" style="flex:1"></div><button class=b data-a=va>+ Add to Vault</button></div>`+S.vault.map((v,i)=>`<div class=card><b>${E(v.w)}</b> – ${E(v.m)}${v.wh?`<br><span class=mut><b>When:</b> ${E(v.wh)}</span>`:''}${v.hw?`<br><span class=mut><b>How:</b> ${E(v.hw)}</span>`:''} <div style="margin-top:4px"><button class="b s" data-a=vd data-i=${i}>✕ Remove</button></div></div>`).join('');
  else if(tab==='gram')body=GRAM.Idioms+`<div class=row><button class=b data-a=tab data-t=study>Back to Vault →</button></div>`;
  else body=D.map(card).join('');
  show(`<h3>💰 Idioms & Vocabulary</h3>${tabs('Idioms','📖 Full Library ('+D.length+')')}${body}`)};

/* ---- Profile & About ---- */
H.nm=t=>{S.name=t.value.trim()||'George Samir Lamee';save();hud()};
H.key=t=>{S.apiKey=t.value.trim();save();toast('Gemini AI Key saved!')};
R.Profile=()=>{const l=Math.floor(S.xp/100)+1,best=S.exams.length?Math.max(...S.exams.map(e=>e.o)):null;show(`<h3>🗺️ Explorer Profile</h3>
<div class=row><input value="${E(S.name)}" onchange="H.nm(this)" aria-label="Name"><label>Target band <select onchange="S.target=+this.value;save()">${[6,6.5,7,7.5,8,8.5,9].map(b=>`<option${b==S.target?' selected':''}>${b}</option>`).join('')}</select></label></div>
<div class=card style="border:2px solid var(--acc)"><b>🔑 Free Gemini AI Key (Real Audio & Essay Examiner):</b>
  <div class=row><input type=password value="${E(S.apiKey||'')}" onchange="H.key(this)" placeholder="Paste AIzaSy... key here" style="flex:1"></div>
  <div class=mut>Get a free API key at <b>aistudio.google.com</b> (no credit card required). Enables real voice transcription, silence detection, and Band 8.5 corrections.</div>
</div>
<div class=card><b>Level ${l}</b> · ${S.xp} XP<div class=bar><i style="width:${S.xp%100}%"></i></div></div>`+Object.keys(S.trk).map(k=>`<div>${k} · ${S.trk[k]}%<div class=bar><i style="width:${S.trk[k]}%"></i></div></div>`).join('')+`<p>Best mock overall: <b>${best??'–'}</b> / target <b>${S.target}</b></p><div class=card><b>👨‍🏫 Lead IELTS Tutor:</b> Dr. Mohamed Khalil<br><b>🛠️ App Creator:</b> George Samir Lamee</div>`)};

R.About=()=>show(`<h3>ℹ️ About IELTS Island</h3>
<div class=card><b>IELTS Island: Band 8 Quest</b><br><span class=mut>Course-Driven Study, Grammar & AI Evaluation Companion</span></div>
<div class=card><b>🛠️ Created & Developed by:</b><br><span style="font-size:17px;font-weight:700">George Samir Lamee</span></div>
<div class=card><b>👨‍🏫 Lead IELTS Academic Tutor:</b><br><span style="font-size:17px;font-weight:700">Dr. Mohamed Khalil</span></div>
<div class=card><b>✨ Core Modules:</b><ul style="margin:6px 0 0 18px;padding:0">
<li>In-App Course Material Viewer (PDF, Images & Notes) + YouTube Course Channel Playlists</li>
<li>Skill-Specific Grammar References</li>
<li>Real Multimodal AI Speaking Examiner (Audio Transcription, Silence Check & Pronunciation/Grammar Feedback)</li>
<li>Writing Task 1 (Letters) & Task 2 (Essays) AI Evaluator + Line-by-Line Corrections</li>
<li>Band 8 Vocabulary & Idioms Library with When & How to Say Coaching</li>
</ul></div>`);

/* ---- Course materials (In-App PDF/Image/Text Viewer) & To-Do ---- */
H.pickM=()=>{const inp=$('#mf');if(inp){inp.value='';inp.click()}};
H.onPick=()=>{const fs=[...($('#mf')?.files||[])];if($('#mfLbl'))$('#mfLbl').textContent=fs.length?fs.map(f=>f.name).join(', '):'No file selected yet'};
H.addM=async()=>{const fs=[...($('#mf')?.files||[])],tr=$('#mt').value,nt=$('#mn').value.trim();if(!fs.length&&!nt)return toast('Choose a file or write a study note');
for(const f of fs){const id=Date.now()+Math.floor(Math.random()*10000);await putFile(id,f);S.mats.push({id,n:f.name,tr,nt,hasFile:true,type:f.type})}
if(!fs.length)S.mats.push({id:Date.now(),n:nt.slice(0,45),tr,nt,hasFile:false});
save();toast('Material saved to '+tr+'!');refresh()};
H.openM=t=>{const m=S.mats[t.dataset.i];if(m)viewMaterial(m.id,'#mView')};
H.sched=t=>{const m=S.mats[t.dataset.i];S.todo.push({id:Date.now(),t:m.n,tr:m.tr,date:today(),done:false});save();hud();toast('Added to Today’s To-Do')};
H.delM=async t=>{const m=S.mats[t.dataset.i];if(m&&m.hasFile)await delFile(m.id);S.mats.splice(t.dataset.i,1);save();refresh()};

R.Materials=()=>show(`<h3 style="clear:none">📚 Course Materials</h3><div class=mut style="margin-bottom:6px">Dr. Mohamed Khalil’s Course Library</div>
<div class=card>
  <input type=file id=mf multiple style="display:none" onchange="H.onPick()">
  <div class=row><button class="b s" data-a=pickM>📂 Choose File (PDF / Image / Txt)</button><span id=mfLbl class=mut>No file selected yet</span></div>
  <div class=row><label>Assign to Section: <select id=mt>${['Listening','Reading','Writing','Speaking','Vocabulary'].map(t=>`<option>${t}</option>`).join('')}</select></label></div>
  <input id=mn placeholder="Study note or summary (optional)" style="width:100%">
  <div class=row><button class=b data-a=addM>⬆️ Upload & Save Material</button></div>
</div>
<div id=mView></div>`+S.mats.map((m,i)=>`<div class=card><b>${E(m.n)}</b> <span class=mut>[${m.tr}]</span><div class=mut>${E(m.nt||'')}</div><div class=row><button class="b s" data-a=openM data-i=${i}>👁️ Open</button><button class=b data-a=sched data-i=${i}>📅 Add to today</button><button class="b s" data-a=delM data-i=${i}>✕</button></div></div>`).join(''));

H.dn=t=>{const it=S.todo.find(x=>x.id==t.dataset.id);it.done=!it.done;if(it.done&&!it.paid){it.paid=1;gain(10,it.tr)}save();hud();refresh()};
H.dt=t=>{S.todo=S.todo.filter(x=>x.id!=t.dataset.id);save();hud();refresh()};
R.Todo=()=>{const l=S.todo.filter(t=>t.date===today());show(`<h3 style="clear:none">✅ Today’s To-Do</h3>`+(l.map(t=>`<div class=card><div class=row><button class="b ${t.done?'':'s'}" data-a=dn data-id=${t.id}>${t.done?'✔ Done':'☐ Done?'}</button><span style="flex:1;${t.done?'text-decoration:line-through;opacity:.6':''}">${E(t.t)} <span class=mut>[${t.tr}]</span></span><button class="b s" data-a=dt data-id=${t.id}>✕</button></div></div>`).join('')||'<p class=mut>Nothing scheduled. Open Course Materials and tap “Add to today”.</p>'))};

/* ---- reminders ---- */
function remind(){const p=pend(),b=$('#banner');hud();if(!p.length){b.style.display='none';return}b.innerHTML=`⏰ ${p.length} study task${p.length>1?'s':''} pending: ${E(p.slice(0,2).map(t=>t.t).join(', '))}${p.length>2?'…':''}<br><button class=b onclick="open(R.Todo,1)">Open To-Do</button>`;b.style.display='block';chime()}
setInterval(remind,60000);setTimeout(remind,6000);

/* ---- boot ---- */
hud();
cutout("hero.jpeg").then(u=>{$('#hi').src=u;$('#hi').style.visibility='visible'});
</script>
</body>
</html>
